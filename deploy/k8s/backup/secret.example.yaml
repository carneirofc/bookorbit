# Credentials for the backup and restore jobs.
# Copy to secret.yaml, fill in the values, and apply it. Never commit the filled-in copy.
# Store RESTIC_PASSWORD outside the cluster as well: without it the backups cannot be read.
apiVersion: v1
kind: Secret
metadata:
  name: bookorbit-backup
  namespace: bookorbit
type: Opaque
stringData:
  # S3-compatible endpoint and bucket, for example s3:https://minio.example.com/bookorbit-backups
  RESTIC_REPOSITORY: "s3:https://s3.example.com/bookorbit-backups"
  RESTIC_PASSWORD: "change-me-generate-with-openssl-rand-base64-32"
  AWS_ACCESS_KEY_ID: "change-me"
  AWS_SECRET_ACCESS_KEY: "change-me"
  # Some S3 providers (MinIO, Garage) need a region even if it is ignored.
  AWS_DEFAULT_REGION: "us-east-1"
  # Same database BookOrbit uses. The role must be able to read every table (pg_dump)
  # and, for restores, create objects in the target database.
  DATABASE_URL: "postgres://bookorbit:change-me@bookorbit-postgres.bookorbit.svc:5432/bookorbit"
