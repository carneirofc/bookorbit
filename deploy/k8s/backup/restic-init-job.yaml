# One-time job: creates the encrypted restic repository in the S3 bucket.
# Safe to re-run: it exits successfully if the repository already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: bookorbit-restic-init
  namespace: bookorbit
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.18.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if restic cat config >/dev/null 2>&1; then
                echo "restic repository already initialized"
              else
                restic init
              fi
          envFrom:
            - secretRef:
                name: bookorbit-backup
